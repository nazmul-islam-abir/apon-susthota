name: amar_diet
description: Apon Susthota (আপন সুস্থতা) — Bangladeshi diabetic meal recommendation app
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  fl_chart: ^1.2.0
  auto_size_text: ^3.0.0
  animated_notch_bottom_bar: 1.0.4
  video_player: ^2.9.1
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.4
  firebase_core: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
